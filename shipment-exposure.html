<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EKÁER/NAV Szállítási Kitettségi Riport</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<script>
const DATA_URL = 'docs/data/ekaer_dashboard_summary.json';

function qT(row) {
  return Number(row.quantity_total_t ?? row.quantity_total ?? 0);
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString('hu-HU', { maximumFractionDigits: 0 });
}

function formatShort(value) {
  const n = Number(value || 0);
  if (Math.abs(n) >= 1000000) return (n / 1000000).toLocaleString('hu-HU', { maximumFractionDigits: 1 }) + ' M';
  if (Math.abs(n) >= 1000) return (n / 1000).toLocaleString('hu-HU', { maximumFractionDigits: 1 }) + ' ezer';
  return formatNumber(n);
}

function objectToSortedEntries(obj, limit = null) {
  const entries = Object.entries(obj || {}).sort((a, b) => Number(b[1]) - Number(a[1]));
  return limit ? entries.slice(0, limit) : entries;
}

function createChart(ctx, config) {
  return new Chart(ctx, config);
}

function barChart(canvasId, labels, values, label, horizontal = false, unit = '') {
  return createChart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label,
        data: values,
        backgroundColor: ['#2563eb', '#16a34a', '#f97316', '#dc2626', '#7c3aed', '#0891b2', '#64748b', '#ca8a04']
      }]
    },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => `${label}: ${formatNumber(context.raw)}${unit ? ' ' + unit : ''}`
          }
        }
      },
      scales: {
        x: { beginAtZero: true },
        y: { beginAtZero: true }
      }
    }
  });
}

function lineChart(canvasId, labels, values, label) {
  return createChart(document.getElementById(canvasId), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label,
        data: values,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,.14)',
        fill: true,
        tension: 0.35,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        tooltip: {
          callbacks: {
            label: context => `${label}: ${formatNumber(context.raw)} t`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: value => formatShort(value) + ' t' }
        }
      }
    }
  });
}

function stackedMatrixChart(data) {
  const matrix = Array.isArray(data.quarry_county_matrix) ? data.quarry_county_matrix : [];
  const counties = [...new Set(matrix.map(item => item.county))];
  const quarries = [...new Set(matrix.map(item => item.quarry))];

  const colors = ['#2563eb', '#16a34a', '#f97316', '#dc2626', '#7c3aed', '#64748b'];

  const datasets = quarries.map((quarry, index) => ({
    label: quarry,
    data: counties.map(county => {
      const row = matrix.find(item => item.county === county && item.quarry === quarry);
      return row ? qT(row) : 0;
    }),
    backgroundColor: colors[index % colors.length]
  }));

  return createChart(document.getElementById('matrixChart'), {
    type: 'bar',
    data: { labels: counties, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            label: context => `${context.dataset.label}: ${formatNumber(context.raw)} t`
          }
        }
      },
      scales: {
        x: { stacked: true },
        y: {
          stacked: true,
          beginAtZero: true,
          ticks: { callback: value => formatShort(value) + ' t' }
        }
      }
    }
  });
}

function renderDashboard(data) {
  document.getElementById('quantityTotal').textContent =
    formatShort(data.quantity_total_t ?? data.quantity_total) + ' t';

  const matrix = data.quarry_county_matrix || [];
  stackedMatrixChart(data);
}
</script>
</body>
</html>
