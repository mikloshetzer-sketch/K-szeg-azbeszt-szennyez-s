name: Update affected street geometry

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'

permissions:
  contents: write

jobs:
  update-streets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download affected street geometry
        run: python scripts/update_affected_streets.py

      - name: Commit updated geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/affected_streets.geojson
          if git diff --cached --quiet; then
            echo "No street geometry changes."
          else
            git commit -m "Update affected street geometry"
            git push
          fi
