name: Update Official Asbestos Measurements

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: official-asbestos-measurements
  cancel-in-progress: false

jobs:

  update-official-measurements:

    name: Vas Kormányhivatal adatok frissítése

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      # ===================================================
      # 1. REPOSITORY
      # ===================================================

      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ===================================================
      # 2. NODE
      # ===================================================

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ===================================================
      # 3. FÜGGŐSÉGEK
      # ===================================================

      - name: Node függőségek telepítése
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ===================================================
      # 4. SCRIPT ELLENŐRZÉS
      # ===================================================

      - name: Scriptek ellenőrzése
        run: |
          echo "======================================"
          echo "SCRIPT ELLENŐRZÉS"
          echo "======================================"

          test -f scripts/fetch-official-measurements.js
          echo "fetch-official-measurements.js: OK"

          test -f scripts/extract-official-pdfs.js
          echo "extract-official-pdfs.js: OK"

          node -e "
            require('pdf-parse');
            console.log('pdf-parse: OK');
          "


      # ===================================================
      # 5. KORMÁNYHIVATALI INDEX
      # ===================================================

      - name: Hivatalos dokumentumindex frissítése
        run: |
          echo "======================================"
          echo "VAS KORMÁNYHIVATAL"
          echo "======================================"

          node scripts/fetch-official-measurements.js


      # ===================================================
      # 6. PDF PARSER V3
      # ===================================================

      - name: Hivatalos PDF-ek feldolgozása
        run: |
          echo "======================================"
          echo "HIVATALOS PDF ADATKINYERÉS – V3"
          echo "======================================"

          node scripts/extract-official-pdfs.js


      # ===================================================
      # 7. FÁJLOK ELLENŐRZÉSE
      # ===================================================

      - name: Generált fájlok ellenőrzése
        run: |
          test -f data/official_documents.json
          test -f data/official_measurements.json
          test -f data/official_measurement_extractions.json
          test -f data/official_air_measurements.json

          echo ""
          echo "Generált fájlok:"
          echo ""

          ls -lh \
            data/official_documents.json \
            data/official_measurements.json \
            data/official_measurement_extractions.json \
            data/official_air_measurements.json


      # ===================================================
      # 8. STRUKTURÁLT ADAT VALIDÁCIÓ
      # ===================================================

      - name: Strukturált levegőmérések validálása
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "data/official_air_measurements.json";

          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("STRUKTURÁLT LEVEGŐMÉRÉSEK");
          console.log("======================================");

          console.log(
            "Schema:",
            data.schema_version
          );

          console.log(
            "Elfogadott mérések:",
            data.measurement_count
          );

          console.log(
            "Ellenőrzendő sorok:",
            data.review_count
          );

          if (
            !Array.isArray(
              data.measurements
            )
          ) {
            throw new Error(
              "A measurements mező nem tömb."
            );
          }

          if (
            !Array.isArray(
              data.review_queue
            )
          ) {
            throw new Error(
              "A review_queue mező nem tömb."
            );
          }

          for (
            const item of
            data.measurements
          ) {
            if (!item.sample_id) {
              throw new Error(
                "Hiányzó sample_id."
              );
            }

            if (
              !Number.isFinite(
                item.concentration_fibres_m3
              )
            ) {
              throw new Error(
                `Hibás koncentráció: ${item.sample_id}`
              );
            }

            if (
              item.confidence !== "high"
            ) {
              throw new Error(
                `Nem high-confidence rekord került az elfogadott adatbázisba: ${item.sample_id}`
              );
            }
          }

          console.log("");
          console.log(
            "Validáció: OK"
          );

          NODE


      # ===================================================
      # 9. ADATOK KIÍRÁSA
      # ===================================================

      - name: Elfogadott mérési eredmények
        run: |
          node <<'NODE'

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_measurements.json",
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("ELFOGADOTT MÉRÉSEK");
          console.log("======================================");

          for (
            const item of
            data.measurements
          ) {
            console.log(
              `${item.sample_id} | ` +
              `${item.concentration_fibres_m3} rost/m3 | ` +
              `${item.location || "-"} | ` +
              `${item.lat ?? "-"}, ${item.lon ?? "-"} | ` +
              `${item.parser}`
            );
          }

          console.log("");
          console.log("======================================");
          console.log("REVIEW QUEUE");
          console.log("======================================");

          for (
            const item of
            data.review_queue
          ) {
            console.log(
              `${item.sample_id} | ${item.reason}`
            );

            if (
              item.candidates?.length
            ) {
              console.log(
                "  Jelöltek:",
                item.candidates
                  .map(
                    candidate =>
                      candidate.raw
                  )
                  .join(", ")
              );
            }
          }

          NODE


      # ===================================================
      # 10. GIT
      # ===================================================

      - name: Git változások ellenőrzése
        id: changes
        shell: bash
        run: |
          git add \
            data/official_documents.json \
            data/official_measurements.json \
            data/official_measurement_extractions.json \
            data/official_air_measurements.json

          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "Nincs új vagy módosult hivatalos adat."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Új vagy módosult hivatalos adat található."

            git diff --cached --stat

          fi


      # ===================================================
      # 11. COMMIT
      # ===================================================

      - name: Adatok mentése
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Frissített hivatalos azbeszt mérési adatok"

          git push


      # ===================================================
      # 12. SUMMARY
      # ===================================================

      - name: Workflow összegzés
        if: always()
        run: |
          echo "## Vas Kormányhivatal – azbeszt monitor" >> "$GITHUB_STEP_SUMMARY"

          if [ -f data/official_air_measurements.json ]; then

            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_measurements.json",
                "utf8"
              )
            );

          console.log("");
          console.log(
            `- Elfogadott levegőmérések: **${data.measurement_count ?? 0}**`
          );

          console.log(
            `- Manuális ellenőrzést igénylő sorok: **${data.review_count ?? 0}**`
          );

          console.log(
            `- Mértékegység: **${data.unit || "rost/m3"}**`
          );

          NODE

          fi
