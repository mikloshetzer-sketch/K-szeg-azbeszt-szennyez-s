name: Update Official Asbestos Measurements

on:
  workflow_dispatch:

  # Automatikus futás naponta kétszer
  # UTC szerint: 05:30 és 17:30
  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: official-asbestos-measurements
  cancel-in-progress: false

jobs:
  update-official-measurements:
    name: Vas Kormányhivatal adatok frissítése
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ===================================================
      # 1. REPOSITORY
      # ===================================================

      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ===================================================
      # 2. NODE.JS
      # ===================================================

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ===================================================
      # 3. FÜGGŐSÉGEK
      # ===================================================

      - name: Node függőségek telepítése
        run: |
          echo "======================================"
          echo "NODE FÜGGŐSÉGEK"
          echo "======================================"

          if [ -f package-lock.json ]; then
            echo "package-lock.json megtalálva -> npm ci"
            npm ci
          else
            echo "Nincs package-lock.json -> npm install"
            npm install
          fi


      # ===================================================
      # 4. KÖRNYEZET ELLENŐRZÉSE
      # ===================================================

      - name: Környezet ellenőrzése
        run: |
          echo "======================================"
          echo "KÖRNYEZET"
          echo "======================================"

          echo ""
          echo "Node verzió:"
          node --version

          echo ""
          echo "NPM verzió:"
          npm --version

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Scriptek ellenőrzése:"

          test -f scripts/fetch-official-measurements.js
          echo "fetch-official-measurements.js: OK"

          test -f scripts/extract-official-pdfs.js
          echo "extract-official-pdfs.js: OK"

          echo ""
          echo "pdf-parse ellenőrzése:"

          node -e "
            require('pdf-parse');
            console.log('pdf-parse: OK');
          "


      # ===================================================
      # 5. KORMÁNYHIVATALI DOKUMENTUMOK FRISSÍTÉSE
      # ===================================================

      - name: Hivatalos dokumentumok frissítése
        run: |
          echo "======================================"
          echo "KORMÁNYHIVATALI DOKUMENTUMOK"
          echo "======================================"

          node scripts/fetch-official-measurements.js


      # ===================================================
      # 6. DOKUMENTUMINDEX ELLENŐRZÉSE
      # ===================================================

      - name: Dokumentumindex ellenőrzése
        run: |
          echo "======================================"
          echo "DOKUMENTUMINDEX ELLENŐRZÉSE"
          echo "======================================"

          test -f data/official_documents.json
          test -f data/official_measurements.json

          node <<'NODE'

          const fs = require("fs");

          const documents = JSON.parse(
            fs.readFileSync(
              "data/official_documents.json",
              "utf8"
            )
          );

          const measurements = JSON.parse(
            fs.readFileSync(
              "data/official_measurements.json",
              "utf8"
            )
          );

          console.log(
            "official_documents.json: OK"
          );

          console.log(
            "official_measurements.json: OK"
          );

          console.log("");

          console.log(
            "Hivatalos dokumentumok:",
            documents.statistics?.total_documents ?? 0
          );

          console.log(
            "Levegőmérési dokumentumok:",
            documents.statistics?.air_measurement_documents ?? 0
          );

          console.log(
            "Kőzetvizsgálati dokumentumok:",
            documents.statistics?.rock_measurement_documents ?? 0
          );

          console.log(
            "Mérési dokumentumok összesen:",
            measurements.total_measurement_documents ?? 0
          );

          NODE


      # ===================================================
      # 7. PDF ADATKINYERÉS
      # ===================================================

      - name: Hivatalos PDF-ek feldolgozása
        run: |
          echo "======================================"
          echo "HIVATALOS PDF ADATKINYERÉS"
          echo "======================================"

          node scripts/extract-official-pdfs.js


      # ===================================================
      # 8. PDF EXTRACTION JSON ELLENŐRZÉSE
      # ===================================================

      - name: PDF-adatkinyerés ellenőrzése
        run: |
          test -f data/official_measurement_extractions.json

          node <<'NODE'

          const fs = require("fs");

          const file =
            "data/official_measurement_extractions.json";

          const data = JSON.parse(
            fs.readFileSync(
              file,
              "utf8"
            )
          );

          console.log("");
          console.log("======================================");
          console.log("PDF ADATKINYERÉSI EREDMÉNY");
          console.log("======================================");

          console.log(
            "Dokumentumok:",
            data.statistics?.total_documents ?? 0
          );

          console.log(
            "Sikeres feldolgozás:",
            data.statistics?.successful_extractions ?? 0
          );

          console.log(
            "Hibás feldolgozás:",
            data.statistics?.failed_extractions ?? 0
          );

          console.log(
            "Cache-ből megtartva:",
            data.statistics?.reused_extractions ?? 0
          );

          console.log(
            "Talált mérési értékek:",
            data.statistics?.detected_measurement_values ?? 0
          );

          console.log(
            "Talált koordináták:",
            data.statistics?.detected_coordinates ?? 0
          );

          console.log("======================================");

          NODE


      # ===================================================
      # 9. DOKUMENTUMONKÉNTI DIAGNOSZTIKA
      # ===================================================

      - name: Dokumentumonkénti találatok
        run: |
          node <<'NODE'

          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "data/official_measurement_extractions.json",
              "utf8"
            )
          );

          console.log("");
          console.log("======================================");
          console.log("DOKUMENTUMONKÉNTI EREDMÉNY");
          console.log("======================================");

          for (const item of data.extractions || []) {

            console.log("");
            console.log("--------------------------------------");

            console.log(
              item.source_title || "Névtelen dokumentum"
            );

            console.log(
              "Kategória:",
              item.measurement_category || "-"
            );

            console.log(
              "PDF oldalak:",
              item.pdf_pages ?? "-"
            );

            console.log(
              "Szöveg hossza:",
              item.text_length ?? 0
            );

            console.log(
              "Státusz:",
              item.extraction_status || "-"
            );

            console.log(
              "Cache:",
              item.reused === true
                ? "igen"
                : "nem"
            );

            console.log(
              "Mérési értékek:",
              item.statistics?.measurement_values ?? 0
            );

            console.log(
              "Koordináták:",
              item.statistics?.coordinates ?? 0
            );

            console.log(
              "Azbeszttípusok:",
              (item.detected_asbestos_types || []).join(", ") || "-"
            );

            const values =
              item.detected_measurement_values || [];

            if (values.length > 0) {

              console.log("");
              console.log("Talált értékek:");

              for (
                const value of values.slice(0, 30)
              ) {

                console.log(
                  `  ${value.raw} -> ${value.value} ${value.unit}`
                );

              }

            }

            const coordinates =
              item.detected_coordinates || [];

            if (coordinates.length > 0) {

              console.log("");
              console.log("Talált koordináták:");

              for (
                const coordinate of coordinates.slice(0, 10)
              ) {

                console.log(
                  `  ${coordinate.lat}, ${coordinate.lon}`
                );

              }

            }

          }

          console.log("");
          console.log("======================================");

          NODE


      # ===================================================
      # 10. ADATMINŐSÉG ELLENŐRZÉSE
      # ===================================================

      - name: Adatminőség ellenőrzése
        run: |
          node <<'NODE'

          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "data/official_measurement_extractions.json",
              "utf8"
            )
          );

          const total =
            data.statistics?.total_documents ?? 0;

          const success =
            data.statistics?.successful_extractions ?? 0;

          const failed =
            data.statistics?.failed_extractions ?? 0;

          if (total === 0) {
            throw new Error(
              "Nincs feldolgozható mérési dokumentum."
            );
          }

          if (success === 0) {
            throw new Error(
              "Egyetlen PDF feldolgozása sem sikerült."
            );
          }

          if (failed > 0) {
            console.warn(
              `FIGYELMEZTETÉS: ${failed} dokumentum feldolgozása sikertelen.`
            );
          }

          console.log("");
          console.log(
            `Validáció OK: ${success}/${total} dokumentum feldolgozva.`
          );

          NODE


      # ===================================================
      # 11. GENERÁLT FÁJLOK
      # ===================================================

      - name: Generált fájlok ellenőrzése
        run: |
          echo "======================================"
          echo "GENERÁLT ADATFÁJLOK"
          echo "======================================"

          ls -lh data/official_documents.json
          ls -lh data/official_measurements.json
          ls -lh data/official_measurement_extractions.json


      # ===================================================
      # 12. GIT VÁLTOZÁSOK
      # ===================================================

      - name: Git változások ellenőrzése
        id: changes
        shell: bash
        run: |
          git add \
            data/official_documents.json \
            data/official_measurements.json \
            data/official_measurement_extractions.json

          # Ha az npm install létrehozott package-lock.json-t,
          # azt is elmentjük.
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Nincs új vagy módosult hivatalos adat."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Új vagy módosult hivatalos adat található."

            echo ""
            echo "Változások:"

            git diff --cached --stat

          fi


      # ===================================================
      # 13. COMMIT + PUSH
      # ===================================================

      - name: Frissített adatok mentése
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Frissített hivatalos azbeszt mérési adatok és PDF kinyerés"

          git push


      # ===================================================
      # 14. WORKFLOW SUMMARY
      # ===================================================

      - name: Workflow összegzés
        if: always()
        shell: bash
        run: |
          echo "## Vas Kormányhivatal – azbeszt monitor" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f data/official_measurement_extractions.json ]; then

            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"

          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync(
              "data/official_measurement_extractions.json",
              "utf8"
            )
          );

          console.log(
            `- Feldolgozott mérési dokumentumok: **${data.statistics?.total_documents ?? 0}**`
          );

          console.log(
            `- Sikeres PDF-kinyerések: **${data.statistics?.successful_extractions ?? 0}**`
          );

          console.log(
            `- Hibás PDF-kinyerések: **${data.statistics?.failed_extractions ?? 0}**`
          );

          console.log(
            `- Cache-ből megtartott kinyerések: **${data.statistics?.reused_extractions ?? 0}**`
          );

          console.log(
            `- Talált mérési értékek: **${data.statistics?.detected_measurement_values ?? 0}**`
          );

          console.log(
            `- Talált koordináták: **${data.statistics?.detected_coordinates ?? 0}**`
          );

          NODE

          else

            echo "- A PDF-adatkinyerési fájl nem készült el." >> "$GITHUB_STEP_SUMMARY"

          fi
