name: Update Official Asbestos Measurements

on:
  workflow_dispatch:

  schedule:
    - cron: "30 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: official-asbestos-measurements
  cancel-in-progress: false

jobs:

  update-official-measurements:

    name: Vas Kormányhivatal adatok frissítése

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      # ===================================================
      # 1. REPOSITORY
      # ===================================================

      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ===================================================
      # 2. NODE
      # ===================================================

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ===================================================
      # 3. FÜGGŐSÉGEK
      # ===================================================

      - name: Node függőségek telepítése
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ===================================================
      # 4. SCRIPT ELLENŐRZÉS
      # ===================================================

      - name: Scriptek ellenőrzése
        run: |
          echo "======================================"
          echo "SCRIPT ELLENŐRZÉS"
          echo "======================================"

          test -f scripts/fetch-official-measurements.js
          echo "fetch-official-measurements.js: OK"

          test -f scripts/extract-official-pdfs.js
          echo "extract-official-pdfs.js: OK"

          test -f scripts/build-official-air-dashboard.js
          echo "build-official-air-dashboard.js: OK"

          node -e "
            require('pdf-parse');
            console.log('pdf-parse: OK');
          "


      # ===================================================
      # 5. KORMÁNYHIVATALI INDEX
      # ===================================================

      - name: Hivatalos dokumentumindex frissítése
        run: |
          echo "======================================"
          echo "VAS KORMÁNYHIVATAL"
          echo "======================================"

          node scripts/fetch-official-measurements.js


      # ===================================================
      # 6. PDF PARSER V4.2
      # ===================================================

      - name: Hivatalos PDF-ek feldolgozása
        run: |
          echo "======================================"
          echo "HIVATALOS PDF ADATKINYERÉS – V4.2"
          echo "======================================"

          node scripts/extract-official-pdfs.js


      # ===================================================
      # 7. DASHBOARD ADATFELDOLGOZÁS
      # ===================================================

      - name: Dashboard adatfájl elkészítése
        run: |
          echo "======================================"
          echo "DASHBOARD DATA PROCESSOR – V1.0"
          echo "======================================"

          node scripts/build-official-air-dashboard.js


      # ===================================================
      # 8. FÁJLOK ELLENŐRZÉSE
      # ===================================================

      - name: Generált fájlok ellenőrzése
        run: |
          test -f data/official_documents.json
          test -f data/official_measurements.json
          test -f data/official_measurement_extractions.json
          test -f data/official_air_measurements.json
          test -f data/official_air_dashboard.json

          echo ""
          echo "Generált fájlok:"
          echo ""

          ls -lh \
            data/official_documents.json \
            data/official_measurements.json \
            data/official_measurement_extractions.json \
            data/official_air_measurements.json \
            data/official_air_dashboard.json


      # ===================================================
      # 9. STRUKTURÁLT LEVEGŐMÉRÉSEK VALIDÁLÁSA
      # ===================================================

      - name: Strukturált levegőmérések validálása
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "data/official_air_measurements.json";

          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("STRUKTURÁLT LEVEGŐMÉRÉSEK");
          console.log("======================================");

          console.log(
            "Schema:",
            data.schema_version
          );

          console.log(
            "Parser:",
            data.parser_version
          );

          console.log(
            "Elfogadott mérések:",
            data.measurement_count
          );

          console.log(
            "Ellenőrzendő sorok:",
            data.review_count
          );

          if (
            !Array.isArray(
              data.measurements
            )
          ) {
            throw new Error(
              "A measurements mező nem tömb."
            );
          }

          if (
            !Array.isArray(
              data.review_queue
            )
          ) {
            throw new Error(
              "A review_queue mező nem tömb."
            );
          }

          if (
            data.measurements.length !==
            data.measurement_count
          ) {
            throw new Error(
              "A measurement_count nem egyezik a measurements tömb hosszával."
            );
          }

          for (
            const item of
            data.measurements
          ) {

            if (!item.sample_id) {
              throw new Error(
                "Hiányzó sample_id."
              );
            }

            if (
              !Number.isFinite(
                item.concentration_fibres_m3
              )
            ) {
              throw new Error(
                `Hibás koncentráció: ${item.sample_id}`
              );
            }

            if (
              item.confidence !== "high"
            ) {
              throw new Error(
                `Nem high-confidence rekord került az elfogadott adatbázisba: ${item.sample_id}`
              );
            }
          }

          console.log("");
          console.log(
            "Strukturált mérési validáció: OK"
          );

          NODE


      # ===================================================
      # 10. DASHBOARD ADAT VALIDÁLÁSA
      # ===================================================

      - name: Dashboard adat validálása
        run: |
          node <<'NODE'

          const fs = require("fs");

          const source =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_measurements.json",
                "utf8"
              )
            );

          const dashboard =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_dashboard.json",
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("DASHBOARD ADAT VALIDÁCIÓ");
          console.log("======================================");

          if (
            !Array.isArray(
              dashboard.measurements
            )
          ) {
            throw new Error(
              "A dashboard measurements mező nem tömb."
            );
          }

          if (
            !Array.isArray(
              dashboard.sites
            )
          ) {
            throw new Error(
              "A dashboard sites mező nem tömb."
            );
          }

          if (
            !Array.isArray(
              dashboard.timeline
            )
          ) {
            throw new Error(
              "A dashboard timeline mező nem tömb."
            );
          }

          if (
            !Array.isArray(
              dashboard.map_points
            )
          ) {
            throw new Error(
              "A dashboard map_points mező nem tömb."
            );
          }

          if (
            dashboard.measurements.length !==
            source.measurements.length
          ) {
            throw new Error(
              "A dashboard mérésszáma eltér a forrás mérésszámától."
            );
          }

          if (
            dashboard.kpis.total_measurements !==
            source.measurements.length
          ) {
            throw new Error(
              "A dashboard KPI total_measurements hibás."
            );
          }

          /*
           * Ellenőrizzük, hogy a detection-limit rekord
           * nem került tényleges statisztikai értékként
           * feldolgozásra.
           */

          for (
            const item of
            dashboard.measurements
          ) {

            if (
              item.concentration
                ?.below_detection_limit === true
            ) {

              if (
                item.concentration
                  .numeric_for_statistics !== null
              ) {
                throw new Error(
                  `Detection-limit rekord statisztikai értéket kapott: ${item.sample_id}`
                );
              }

              if (
                !String(
                  item.concentration.display
                ).startsWith("<")
              ) {
                throw new Error(
                  `Detection-limit megjelenítés hibás: ${item.sample_id}`
                );
              }
            }
          }

          console.log(
            "Mérések:",
            dashboard.measurements.length
          );

          console.log(
            "Mérőhelyek:",
            dashboard.sites.length
          );

          console.log(
            "Települések:",
            dashboard.settlements.length
          );

          console.log(
            "Térképi pontok:",
            dashboard.map_points.length
          );

          console.log(
            "Kimutatási határ alatti mérések:",
            dashboard.kpis
              .below_detection_limit_measurements
          );

          console.log("");
          console.log(
            "Dashboard validáció: OK"
          );

          NODE


      # ===================================================
      # 11. ELFOGADOTT MÉRÉSEK KIÍRÁSA
      # ===================================================

      - name: Elfogadott mérési eredmények
        run: |
          node <<'NODE'

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_measurements.json",
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("ELFOGADOTT MÉRÉSEK");
          console.log("======================================");

          for (
            const item of
            data.measurements
          ) {

            const value =
              item.below_detection_limit
                ? `<${item.concentration_fibres_m3}`
                : item.concentration_fibres_m3;

            console.log(
              `${item.sample_id} | ` +
              `${value} rost/m3 | ` +
              `${item.location || "-"} | ` +
              `${item.lat ?? "-"}, ${item.lon ?? "-"} | ` +
              `${item.parser}`
            );
          }

          console.log("");
          console.log("======================================");
          console.log("REVIEW QUEUE");
          console.log("======================================");

          for (
            const item of
            data.review_queue
          ) {

            console.log(
              `${item.sample_id || "-"} | ${item.reason}`
            );

            if (
              item.candidates?.length
            ) {

              console.log(
                "  Jelöltek:",
                item.candidates
                  .map(
                    candidate =>
                      candidate.raw
                  )
                  .join(", ")
              );
            }
          }

          NODE


      # ===================================================
      # 12. DASHBOARD ÖSSZEGZÉS
      # ===================================================

      - name: Dashboard adatok kiírása
        run: |
          node <<'NODE'

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_dashboard.json",
                "utf8"
              )
            );

          console.log("");
          console.log("======================================");
          console.log("DASHBOARD ÖSSZEGZÉS");
          console.log("======================================");

          console.log(
            "Összes mérés:",
            data.kpis.total_measurements
          );

          console.log(
            "Számszerű mérések:",
            data.kpis.numeric_measurements
          );

          console.log(
            "Kimutatási határ alatt:",
            data.kpis
              .below_detection_limit_measurements
          );

          console.log(
            "Mérőhelyek:",
            data.kpis.site_count
          );

          console.log(
            "Települések:",
            data.kpis.settlement_count
          );

          console.log(
            "Első mérés:",
            data.kpis.first_measurement_date
          );

          console.log(
            "Legutóbbi mérés:",
            data.kpis.latest_measurement_date
          );

          console.log(
            "Maximum:",
            data.kpis.maximum_measured_fibres_m3,
            "rost/m3"
          );

          console.log("");
          console.log("TELEPÜLÉSEK");

          for (
            const settlement of
            data.settlements
          ) {

            console.log(
              `${settlement.settlement} | ` +
              `${settlement.measurement_count} mérés | ` +
              `${settlement.site_count} hely | ` +
              `max ${settlement.statistics.max_fibres_m3 ?? "-"} rost/m3`
            );
          }

          NODE


      # ===================================================
      # 13. GIT
      # ===================================================

      - name: Git változások ellenőrzése
        id: changes
        shell: bash
        run: |
          git add \
            data/official_documents.json \
            data/official_measurements.json \
            data/official_measurement_extractions.json \
            data/official_air_measurements.json \
            data/official_air_dashboard.json

          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "Nincs új vagy módosult hivatalos adat."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Új vagy módosult hivatalos adat található."

            git diff --cached --stat

          fi


      # ===================================================
      # 14. COMMIT
      # ===================================================

      - name: Adatok mentése
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Frissített hivatalos azbeszt mérési és dashboard adatok"

          git push


      # ===================================================
      # 15. SUMMARY
      # ===================================================

      - name: Workflow összegzés
        if: always()
        run: |
          echo "## Vas Kormányhivatal – azbeszt monitor" >> "$GITHUB_STEP_SUMMARY"

          if [ -f data/official_air_measurements.json ]; then

            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_measurements.json",
                "utf8"
              )
            );

          console.log("");
          console.log(
            `- Elfogadott levegőmérések: **${data.measurement_count ?? 0}**`
          );

          console.log(
            `- Manuális ellenőrzést igénylő sorok: **${data.review_count ?? 0}**`
          );

          console.log(
            `- Mértékegység: **${data.unit || "rost/m3"}**`
          );

          NODE

          fi

          if [ -f data/official_air_dashboard.json ]; then

            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"

          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "data/official_air_dashboard.json",
                "utf8"
              )
            );

          console.log("");
          console.log("### Dashboard adat");
          console.log("");

          console.log(
            `- Dashboard mérések: **${data.kpis?.total_measurements ?? 0}**`
          );

          console.log(
            `- Mérőhelyek: **${data.kpis?.site_count ?? 0}**`
          );

          console.log(
            `- Települések: **${data.kpis?.settlement_count ?? 0}**`
          );

          console.log(
            `- Térképezhető mérőhelyek: **${data.map_points?.length ?? 0}**`
          );

          console.log(
            `- Kimutatási határ alatti mérések: **${data.kpis?.below_detection_limit_measurements ?? 0}**`
          );

          NODE

          fi
